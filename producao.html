<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Painel de Produção — LightPlast Connect</title>
  <meta name="theme-color" content="#0c1d10" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/producao.css" />
</head>
<body class="prod-body">

  <header class="topbar">
    <div class="topbar-inner prod-topbar">
      <a class="brand" href="index.html" title="Voltar ao portal">
        <div class="logo-mark" style="width:36px;height:36px;font-size:17px;">lp</div>
        <div>
          <div class="brand-name">LIGHT<span>PLAST</span></div>
          <div class="prod-tagline">Painel de Produção</div>
        </div>
      </a>
      <span class="shift-pill">
        <span class="pulse-dot"></span>
        Turno A · Fábrica operando
      </span>
      <div class="topbar-actions">
        <a class="icon-btn" href="index.html" title="Sair do painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </a>
        <div class="avatar" title="João Ferreira — Líder de Produção">JF</div>
      </div>
    </div>
  </header>

  <main class="prod-main">
    <div class="prod-container">

      <div class="prod-head">
        <div>
          <h1>Bom dia, João! 🏭</h1>
          <p>Segunda-feira, 20 de julho · <b id="total-fila"></b> pedidos na esteira de produção</p>
        </div>
        <div class="prod-head-actions">
          <button class="btn btn-ghost btn-sm" onclick="toast('Relatório do turno exportado em PDF 📄')">Exportar relatório do turno</button>
        </div>
      </div>

      <div class="prod-stats" id="prod-stats"></div>

      <div class="section-title" style="margin-top:30px;">
        <h2>Esteira de produção</h2>
        <span class="kanban-hint">Atualize o status de fabricação em 1 clique</span>
      </div>
      <div class="kanban" id="kanban"></div>

      <div class="prod-cols">
        <div>
          <div class="section-title"><h2>Máquinas</h2></div>
          <div id="machines"></div>
        </div>
        <div>
          <div class="section-title"><h2>Concluídos hoje</h2><span class="kanban-hint" id="done-kg"></span></div>
          <div id="done-list"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Sheet: previsão de entrega -->
  <div class="sheet-backdrop" id="eta-sheet">
    <div class="sheet" style="max-width:420px;">
      <div class="sheet-grab"></div>
      <div class="sheet-head">
        <button class="sheet-close" onclick="closeEta()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="sheet-body" id="eta-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/producao-data.js"></script>
  <script src="js/producao.js"></script>
</body>
</html>
